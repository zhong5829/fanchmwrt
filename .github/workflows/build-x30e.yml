name: build-fanchmwrt-x30e

# 手动触发，一次并行编译三种分区布局。
# 首次全量编译（含工具链）约 1~2 小时；三次任务相互独立。

on:
  workflow_dispatch:
  push:
    paths:
      - 'configs/x30e-build.trigger'

permissions:
  contents: read

concurrency:
  group: build-x30e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 350
    strategy:
      fail-fast: false
      matrix:
        device:
          - ruijie_rg-x30e-stock
          - ruijie_rg-x30e-firmware2
          - ruijie_rg-x30e

    steps:
      - name: 释放 runner 磁盘空间
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune -a -f || true
          df -h /

      - name: 安装编译依赖
        run: |
          sudo apt-get update
          sudo apt-get -y install build-essential clang flex bison g++ gawk \
            gcc-multilib g++-multilib gettext git libncurses-dev libssl-dev \
            python3-distutils rsync unzip zlib1g-dev file wget

      - name: 检出源码
        uses: actions/checkout@v4

      - name: 更新并安装 feeds
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: 生成 .config
        env:
          DEVICE: ${{ matrix.device }}
        run: |
          set -e
          cp configs/x30e-target.config .config
          sed -i "s/DEVICE_ruijie_rg-x30e-stock/DEVICE_${DEVICE}/" .config
          make defconfig
          echo "=== 目标选择 ==="
          grep -E '^CONFIG_TARGET' .config
          grep -q "CONFIG_TARGET_mediatek_filogic_DEVICE_${DEVICE}=y" .config \
            || { echo "机型符号未生效：${DEVICE}"; exit 1; }
          cat configs/x30e-packages.config >> .config
          make defconfig
          echo "=== 关键选项 ==="
          grep -E "CONFIG_TARGET_mediatek_filogic_DEVICE_${DEVICE}=|CONFIG_PACKAGE_(fwxd|kmod-fwx|luci-app-fwx-dashboard|luci-theme-fanchmwrt|shortcut-fe)=" .config
          for p in fwxd kmod-fwx luci-app-fwx-dashboard luci-app-fwx-app-center luci-theme-fanchmwrt; do
            grep -q "CONFIG_PACKAGE_${p}=y" .config || { echo "缺少核心包：${p}"; exit 1; }
          done

      - name: 下载软件源码包
        run: make download -j8 || make download -j1 V=s

      - name: 编译固件
        run: make -j"$(nproc)" || make -j1 V=s

      - name: 显示产物
        run: |
          ls -lh bin/targets/mediatek/filogic/
          cd bin/targets/mediatek/filogic/ && sha256sum * 2>/dev/null | tee SHA256.txt || true

      - name: 上传固件
        uses: actions/upload-artifact@v4
        with:
          name: fanchmwrt-${{ matrix.device }}
          path: |
            bin/targets/mediatek/filogic/*.bin
            bin/targets/mediatek/filogic/*.itb
            bin/targets/mediatek/filogic/sha256sums
            bin/targets/mediatek/filogic/profiles.json
          if-no-files-found: error
          retention-days: 14
